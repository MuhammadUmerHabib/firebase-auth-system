<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>
        <img src="./assets/logo.png" alt="">
    </header>

    <section class="container">
        <div class="visual-panel">
            <div class="caption-card">
                <b>Welcome back.</b>
                <p>Placeholder caption. Replace with approved copy.</p>
            </div>
        </div>
        <div class="form-pannel">
            <label for="account" class="eyebrow">Account</label>
            <h1>Sign Up</h1>
            <p class="subtext">Enter your email and password to continue</p>
            <form id="signup-form">
                <label for="email">Email Address</label>
                <input type="email" name="" id="email" placeholder="you@example.com">
                <label for="password">Password</label>
                <input type="password" name="" id="password" placeholder="Enter your password">
                <button type="submit">Sign Up</button>
            </form>
            <p class="link">New to NOVA STEP? <a href="./index.html">Already have an account</a></p>
        </div>
    </section>

    <script type="module" src="./js/auth.js"></script>
</body>

</html>
